<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <!-- Background -->
  <rect width="600" height="300" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="300" y="48" text-anchor="middle" font-family="monospace" font-size="18" fill="#00b8a9" font-weight="bold">ComuniApp · REST API + Mobile</text>

  <!-- Node.js pill -->
  <rect x="40" y="80" width="110" height="40" rx="8" fill="#339933" opacity="0.15" stroke="#339933" stroke-width="1.5"/>
  <text x="95" y="105" text-anchor="middle" font-family="monospace" font-size="14" fill="#4ade80" font-weight="bold">Node.js</text>

  <!-- Express pill -->
  <rect x="165" y="80" width="110" height="40" rx="8" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-width="1.5"/>
  <text x="220" y="105" text-anchor="middle" font-family="monospace" font-size="14" fill="#e2e8f0" font-weight="bold">Express 5</text>

  <!-- MySQL pill -->
  <rect x="290" y="80" width="100" height="40" rx="8" fill="#00758F" opacity="0.15" stroke="#00758F" stroke-width="1.5"/>
  <text x="340" y="105" text-anchor="middle" font-family="monospace" font-size="14" fill="#67e8f9" font-weight="bold">MySQL</text>

  <!-- Expo pill -->
  <rect x="405" y="80" width="90" height="40" rx="8" fill="#4f46e5" opacity="0.15" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="450" y="105" text-anchor="middle" font-family="monospace" font-size="14" fill="#a5b4fc" font-weight="bold">Expo</text>

  <!-- JWT pill -->
  <rect x="40" y="140" width="90" height="40" rx="8" fill="#d97706" opacity="0.15" stroke="#d97706" stroke-width="1.5"/>
  <text x="85" y="165" text-anchor="middle" font-family="monospace" font-size="14" fill="#fbbf24">JWT</text>

  <!-- Swagger pill -->
  <rect x="145" y="140" width="120" height="40" rx="8" fill="#85ea2d" opacity="0.10" stroke="#85ea2d" stroke-width="1.5"/>
  <text x="205" y="165" text-anchor="middle" font-family="monospace" font-size="14" fill="#a3e635">Swagger</text>

  <!-- React Native pill -->
  <rect x="280" y="140" width="150" height="40" rx="8" fill="#61DAFB" opacity="0.10" stroke="#61DAFB" stroke-width="1.5"/>
  <text x="355" y="165" text-anchor="middle" font-family="monospace" font-size="13" fill="#7dd3fc">React Native</text>

  <!-- Docker pill -->
  <rect x="445" y="140" width="110" height="40" rx="8" fill="#2496ED" opacity="0.12" stroke="#2496ED" stroke-width="1.5"/>
  <text x="500" y="165" text-anchor="middle" font-family="monospace" font-size="14" fill="#60a5fa">Docker</text>

  <!-- Zustand pill -->
  <rect x="40" y="200" width="110" height="40" rx="8" fill="#f97316" opacity="0.12" stroke="#f97316" stroke-width="1.5"/>
  <text x="95" y="225" text-anchor="middle" font-family="monospace" font-size="13" fill="#fdba74">Zustand</text>

  <!-- Joi pill -->
  <rect x="165" y="200" width="80" height="40" rx="8" fill="#a855f7" opacity="0.12" stroke="#a855f7" stroke-width="1.5"/>
  <text x="205" y="225" text-anchor="middle" font-family="monospace" font-size="14" fill="#d8b4fe">Joi</text>

  <!-- Winston pill -->
  <rect x="260" y="200" width="110" height="40" rx="8" fill="#64748b" opacity="0.18" stroke="#64748b" stroke-width="1.5"/>
  <text x="315" y="225" text-anchor="middle" font-family="monospace" font-size="14" fill="#94a3b8">Winston</text>

  <!-- expo-router pill -->
  <rect x="385" y="200" width="140" height="40" rx="8" fill="#4f46e5" opacity="0.12" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="455" y="225" text-anchor="middle" font-family="monospace" font-size="13" fill="#a5b4fc">expo-router</text>

  <!-- Bottom label -->
  <text x="300" y="278" text-anchor="middle" font-family="monospace" font-size="12" fill="#475569">Personal Project · Full Stack</text>
</svg>
