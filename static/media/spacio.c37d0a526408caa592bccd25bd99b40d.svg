<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <!-- Background -->
  <rect width="600" height="300" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="300" y="48" text-anchor="middle" font-family="monospace" font-size="18" fill="#00b8a9" font-weight="bold">Spacio · Content Management Microservice</text>

  <!-- Go pill -->
  <rect x="40" y="80" width="90" height="40" rx="8" fill="#00ADD8" opacity="0.15" stroke="#00ADD8" stroke-width="1.5"/>
  <text x="85" y="105" text-anchor="middle" font-family="monospace" font-size="14" fill="#67e8f9" font-weight="bold">Go 1.21</text>

  <!-- Fiber pill -->
  <rect x="145" y="80" width="90" height="40" rx="8" fill="#00ADD8" opacity="0.10" stroke="#00ADD8" stroke-width="1.5"/>
  <text x="190" y="105" text-anchor="middle" font-family="monospace" font-size="14" fill="#a5f3fc">Fiber v2</text>

  <!-- MongoDB pill -->
  <rect x="250" y="80" width="130" height="40" rx="8" fill="#47A248" opacity="0.15" stroke="#47A248" stroke-width="1.5"/>
  <text x="315" y="105" text-anchor="middle" font-family="monospace" font-size="14" fill="#86efac" font-weight="bold">MongoDB Atlas</text>

  <!-- Cloudinary pill -->
  <rect x="395" y="80" width="130" height="40" rx="8" fill="#3448c5" opacity="0.15" stroke="#3448c5" stroke-width="1.5"/>
  <text x="460" y="105" text-anchor="middle" font-family="monospace" font-size="14" fill="#a5b4fc">Cloudinary</text>

  <!-- Docker pill -->
  <rect x="40" y="140" width="100" height="40" rx="8" fill="#2496ED" opacity="0.12" stroke="#2496ED" stroke-width="1.5"/>
  <text x="90" y="165" text-anchor="middle" font-family="monospace" font-size="14" fill="#60a5fa">Docker</text>

  <!-- JWT pill -->
  <rect x="155" y="140" width="80" height="40" rx="8" fill="#d97706" opacity="0.15" stroke="#d97706" stroke-width="1.5"/>
  <text x="195" y="165" text-anchor="middle" font-family="monospace" font-size="14" fill="#fbbf24">JWT</text>

  <!-- CRUD Content pill -->
  <rect x="250" y="140" width="140" height="40" rx="8" fill="#8b5cf6" opacity="0.12" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="320" y="165" text-anchor="middle" font-family="monospace" font-size="13" fill="#c4b5fd">CRUD Content</text>

  <!-- Rating System pill -->
  <rect x="405" y="140" width="140" height="40" rx="8" fill="#f97316" opacity="0.12" stroke="#f97316" stroke-width="1.5"/>
  <text x="475" y="165" text-anchor="middle" font-family="monospace" font-size="13" fill="#fdba74">Rating System</text>

  <!-- Feed pill -->
  <rect x="40" y="200" width="100" height="40" rx="8" fill="#00b8a9" opacity="0.12" stroke="#00b8a9" stroke-width="1.5"/>
  <text x="90" y="225" text-anchor="middle" font-family="monospace" font-size="13" fill="#5eead4">Feed</text>

  <!-- Auto Grading pill -->
  <rect x="155" y="200" width="140" height="40" rx="8" fill="#ec4899" opacity="0.12" stroke="#ec4899" stroke-width="1.5"/>
  <text x="225" y="225" text-anchor="middle" font-family="monospace" font-size="13" fill="#f9a8d4">Auto Grading</text>

  <!-- Microservice pill -->
  <rect x="310" y="200" width="130" height="40" rx="8" fill="#6366f1" opacity="0.12" stroke="#6366f1" stroke-width="1.5"/>
  <text x="375" y="225" text-anchor="middle" font-family="monospace" font-size="13" fill="#a5b4fc">Microservice</text>

  <!-- Clean Arch pill -->
  <rect x="455" y="200" width="110" height="40" rx="8" fill="#64748b" opacity="0.15" stroke="#64748b" stroke-width="1.5"/>
  <text x="510" y="225" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">Clean Arch</text>

  <!-- Bottom label -->
  <text x="300" y="278" text-anchor="middle" font-family="monospace" font-size="12" fill="#475569">Thesis Project · Duoc UC · 2023</text>
