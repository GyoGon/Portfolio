<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Orange rotated square background -->
  <rect x="5" y="5" width="38" height="38" rx="6" transform="rotate(0 24 24)" fill="#F05032"/>
  <!-- Git branch icon: circles and lines -->
  <!-- Main vertical line -->
  <line x1="18" y1="14" x2="18" y2="34" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Branch line -->
  <path d="M18 18 Q30 18 30 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom commit circle -->
  <circle cx="18" cy="34" r="4" fill="#F05032" stroke="white" stroke-width="2.5"/>
  <!-- Top commit circle -->
  <circle cx="18" cy="14" r="4" fill="#F05032" stroke="white" stroke-width="2.5"/>
  <!-- Branch commit circle -->
  <circle cx="30" cy="24" r="4" fill="#F05032" stroke="white" stroke-width="2.5"/>
</svg>
