<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <!-- Background -->
  <rect width="600" height="300" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="300" y="48" text-anchor="middle" font-family="monospace" font-size="17" fill="#00b8a9" font-weight="bold">Expense Tracker · Credit Card</text>

  <!-- Mock bar chart -->
  <rect x="55" y="155" width="30" height="30" rx="3" fill="#6366f1" opacity="0.7"/>
  <rect x="95" y="135" width="30" height="50" rx="3" fill="#6366f1" opacity="0.7"/>
  <rect x="135" y="120" width="30" height="65" rx="3" fill="#6366f1" opacity="0.7"/>
  <rect x="175" y="140" width="30" height="45" rx="3" fill="#6366f1" opacity="0.7"/>
  <rect x="215" y="110" width="30" height="75" rx="3" fill="#6366f1" opacity="0.7"/>
  <!-- Axis -->
  <line x1="50" y1="190" x2="260" y2="190" stroke="#334155" stroke-width="1.5"/>
  <line x1="50" y1="100" x2="50" y2="190" stroke="#334155" stroke-width="1.5"/>
  <text x="155" y="210" text-anchor="middle" font-family="monospace" font-size="10" fill="#475569">Monthly spending</text>

  <!-- Next.js pill -->
  <rect x="295" y="80" width="110" height="36" rx="8" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-width="1.5"/>
  <text x="350" y="103" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffffff" font-weight="bold">Next.js 15</text>

  <!-- TypeScript pill -->
  <rect x="420" y="80" width="130" height="36" rx="8" fill="#3178C6" opacity="0.15" stroke="#3178C6" stroke-width="1.5"/>
  <text x="485" y="103" text-anchor="middle" font-family="monospace" font-size="14" fill="#3178C6" font-weight="bold">TypeScript</text>

  <!-- SQLite pill -->
  <rect x="295" y="130" width="100" height="36" rx="8" fill="#44A8DA" opacity="0.15" stroke="#44A8DA" stroke-width="1.5"/>
  <text x="345" y="153" text-anchor="middle" font-family="monospace" font-size="14" fill="#44A8DA">SQLite</text>

  <!-- Tailwind pill -->
  <rect x="410" y="130" width="140" height="36" rx="8" fill="#38BDF8" opacity="0.12" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="480" y="153" text-anchor="middle" font-family="monospace" font-size="14" fill="#38BDF8">Tailwind CSS</text>

  <!-- React pill -->
  <rect x="295" y="180" width="100" height="36" rx="8" fill="#61DAFB" opacity="0.12" stroke="#61DAFB" stroke-width="1.5"/>
  <text x="345" y="203" text-anchor="middle" font-family="monospace" font-size="14" fill="#61DAFB">React 19</text>

  <!-- CLP pill -->
  <rect x="410" y="180" width="140" height="36" rx="8" fill="#00b8a9" opacity="0.12" stroke="#00b8a9" stroke-width="1.5"/>
  <text x="480" y="203" text-anchor="middle" font-family="monospace" font-size="13" fill="#00b8a9">CLP · Santander</text>

  <!-- Bottom label -->
  <text x="300" y="270" text-anchor="middle" font-family="monospace" font-size="12" fill="#475569">Personal Project · 2024</text>
</svg>
